name: Build with Gradle

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  forge-1_8_9:
    name: Forge 1.8.9
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            forge-1.8.9/**/loom-cache
            forge-1.8.9/**/prebundled-jars
          key: ${{ runner.os }}-forge-${{ hashFiles('forge-1.8.9/**/*.gradle*', 'forge-1.8.9/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-forge-
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

  fabric-26:
    name: Fabric 26.x
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-26.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            fabric-26.x/**/.gradle/loom-cache
          key: ${{ runner.os }}-fabric26-${{ hashFiles('fabric-26.x/**/*.gradle*', 'fabric-26.x/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-fabric26-
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon

  ornithe-1_8_9:
    name: Ornithe 1.8.9
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ornithe-1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
